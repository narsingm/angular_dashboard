name: Trigger Playwright Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Get Deployment Status
        id: deployment
        run: |
          curl \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/status
      - name: Trigger Playwright Repository
        run: |
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.PLAYWRIGHT_PAT }}" \
          https://api.github.com/repos/j3-m2stack/playwright_test/dispatches \
          -d '{
            "event_type": "run-playwright",
            "client_payload": {
              "pr_number": ${{ github.event.pull_request.number }}
            }
          }'