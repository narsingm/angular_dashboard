<div class="users-container" style="padding: 20px;">
  <div class="header" style="margin-bottom: 20px;">
    <h1>User Management</h1>
    <p>Manage the users in your system.</p>
  </div>

  <mat-card class="table-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>All Users</mat-card-title>
      <mat-card-subtitle>List of users</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="table-container" style="overflow-x: auto; margin-top: 20px;">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z0" style="width: 100%;">
          <!-- ID Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> ID </th>
            <td mat-cell *matCellDef="let element"> #{{element.id}} </td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Name </th>
            <td mat-cell *matCellDef="let element"> {{element.name}} </td>
          </ng-container>

          <!-- Role Column -->
          <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef> Role </th>
            <td mat-cell *matCellDef="let element"> {{element.role}} </td>
          </ng-container>

          <!-- Status Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef> Status </th>
            <td mat-cell *matCellDef="let element"> 
              <span class="status-badge" [ngClass]="element.status.toLowerCase()" style="padding: 4px 8px; border-radius: 4px;" [style.backgroundColor]="element.status === 'Active' ? '#e8f5e9' : '#ffebee'" [style.color]="element.status === 'Active' ? '#2e7d32' : '#c62828'">
                {{element.status}}
              </span>
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Actions </th>
            <td mat-cell *matCellDef="let element"> 
              <button mat-icon-button color="primary"><mat-icon>edit</mat-icon></button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
